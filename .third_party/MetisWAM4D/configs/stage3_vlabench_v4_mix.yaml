# Stage 3 VLABench v4 (2026-10-05): continue v3 (step 13688, model + optimizer) for 5000 more steps on the v3 mixture
#   plus targeted gen4d_v3 episodes (insert_flower +600, select_painting +400, select_mahjong +300,
#   select_chemistry_tube +300; official evaluation-track layout), insert_flower and select_painting rows x2 in the
#   gen4d index (scripts/vlabench/build_mix_root.py -> gen4d_v4mix).  Fresh cosine from 13688 to 1/10 at 18688.
#   v3 avg4 (12633-13688): Avg SR 57.4 vs OpenWAM-alpha local 57.6; the losses concentrate in these four tasks.
#   t2: tmux new-session -d -s vlab_train "PYTHONPATH=/ytech_milm_intern/danglingwei/files/EBench_suite/OpenWAM \
#     STOP_MPS=1 bash scripts/vlabench/run_train_local.sh configs/stage3_vlabench_v4_mix.yaml -- \
#     --set init.resume_from=/ytech_milm_intern/danglingwei/outputs/MetisWAM4D_260921/stage3_vlabench_v3_mix/checkpoints/step_0013688"
#   later restarts: the same command without init.resume_from
name: stage3_vlabench_v4_mix
output_dir: /ytech_milm_intern/danglingwei/outputs/MetisWAM4D_260921/stage3_vlabench_v4_mix
notes: >
  v3 continued on gen4d_v4mix (gen4d_v2 + targeted gen4d_v3, weak tasks up-weighted) + the official release, cosine to 1/10.
model:
  experts: [video, track, action]
  action_read: compact
  dense_read_floor: 0.0
  read_action_horizon: 32
  video:  {dim: 3072, ffn_dim: 14336, layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  track:  {dim: 1024, ffn_dim: 4096,  layers: 20, heads: 24, head_dim: 128, freq_dim: 256}
  action: {dim: 1024, ffn_dim: 4096,  layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  latent_channels: 48
  patch: [1, 2, 2]
  action_dim: 80
  proprio_dim: 80
  text_dim: 4096
  num_embodiments: 9
  focus: {d_read: 512, num_queries: 32, kappa: 4, read_layers: track_upper_half, feedback_to_track: false,
          spatial_kernel: gaussian, temporal_window: gaussian, anchor_refine: false, anchor_width: 0.15,
          gamma_init: 0.3, detach_world_hidden: false, progress_dim: 3,
          video_window: [0, 8, 0, 10]}   # head view = top 8x10 token block of the 12x10 video grid
  gradient_checkpointing: false
init:
  track: {mode: fresh}     # every weight comes from resume_from / initialize_from
  # First launch passes --set init.resume_from=<v3 step_0013688> (model + optimizer); later restarts resume from the
  # newest checkpoint here (auto).  initialize_from is the weights-only fallback.
  initialize_from: /ytech_milm_intern/danglingwei/outputs/MetisWAM4D_260921/stage3_vlabench_v3_mix/checkpoints/step_0013688
  start_step: 13688
  resume_from: auto
schedule:
  completion: {video: 1.0, track: 0.5, action: 0.5}
  shift: {video: 5.0, track: 5.0, action: 5.0}
  mixture: {trajectory: 0.4, ordered_independent: 0.4, independent: 0.0, clean_fastest: 0.2, clean_all_but_slowest: 0.0}
  inference_rounds: 20
data:
  spec: {video_channels: 48, video_frames: 3, video_height: 24, video_width: 20, track_channels: 48, track_frames: 3,
         track_height: 16, track_width: 20, kappa: 4, token_patch: [2, 2], action_horizon: 32, action_dim: 80,
         proprio_dim: 80, text_dim: 4096, max_text_len: 512}
  robodojo:
    source: vlabench_mix
    official_root: /ytech_milm_intern/danglingwei/datas/VLABench/official_lerobot
    root: /ytech_milm_intern/danglingwei/datas/VLABench/gen4d_v4mix
    split: train
    samples_per_episode: 4
    alpha_stats: /ytech_milm_intern/danglingwei/datas/VLABench/OpenWAM-Alpha-Sim-VLABench/normalization_stats.npy
    embodiment: 8            # vlabench_franka
    val_split: val
    val_batches: 4           # x 8 ranks x batch 8 = 256 fixed held-out windows per evaluation
  robodojo_encoder:
    vae_path: /m2v_intern/_public_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    depth_stats: /ytech_milm_intern/danglingwei/datas/VLABench/gen4d_v2/depth_stats.json
    dtype: bf16
    unknown_role: false
  batch_size: 8
  num_workers: 10
training:
  max_steps: 18688
  groups:
    video:   {lr: 5.0e-6, ramp_steps: 300}
    track:   {lr: 1.0e-5, ramp_steps: 300}
    action:  {lr: 2.0e-5, ramp_steps: 300}
    focus:   {lr: 1.0e-4, ramp_steps: 300}
    proprio: {lr: 3.0e-6, ramp_steps: 300}
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0
  lr_schedule: cosine
  lr_schedule_start: 13688
  min_lr_ratio: 0.1
  dtype: bf16
  fsdp: true
  fsdp_granularity: block
  fsdp_hybrid: true
  fsdp_reshard_after_forward: true
  reduce_dtype: bf16
  grad_accumulation: 2       # 8 GPUs x batch 8 x 2 = 128 windows per step
  dense_to_compact_steps: 0
  log_every: 10
  checkpoint_every: 0
  checkpoint_every_minutes: 60
  keep_last: 6
  visualize: true
  visualize_samples: 2
  visualize_rounds: 20
  eval_every: 1000
  gpu_filler: true           # queue threshold: GPU utilisation >= 85 % (6 h mean)
  seed: 42
  loss: {video: 1.0, track: 0.2, camera: 0.1, progress: 0.05, action: 1.0, unfold: 0.1, role: 0.1, condition: 0.01,
         read_action: 0.1}
  dropout: {video_only: 0.15, track_only: 0.10, both: 0.05, action_text: 0.10, action_proprio: 0.10}
