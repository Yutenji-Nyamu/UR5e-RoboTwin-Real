robot:
  host: "robot-ip-or-hostname"
  script_port: 30001
  rtde_port: 30004
  rtde_frequency_hz: 10.0
  socket_timeout_s: 10.0
  home_tcp_pose: null

gripper:
  port: "/dev/serial/by-id/your-gripper-device"
  baudrate: 9600
  timeout_s: 1.0

cameras:
  head_serial: "HEAD_CAMERA_SERIAL"
  wrist_serial: "WRIST_CAMERA_SERIAL"
  width: 640
  height: 480
  fps: 30
  save_hz: 10.0
  warmup_frames: 60

collection:
  data_root: "/data/robotics/ur5e-real"
  enable_freedrive_on_start: true
  preview: false
  save_video: false

servoj:
  frequency_hz: 500
  config_xml: "../robot_programs/control_loop_configuration.xml"
  mode: 2
  connect_timeout_s: 15.0
