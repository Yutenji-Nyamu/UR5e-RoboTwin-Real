# RoboTwin 2.0 direct three-expert training, pixel-frame Track4D (u = du/W, v = dv/W, d = dd m; codec.py, 2026-09-26).
# Continues the rt2_direct_v2 curriculum from its last checkpoint (step 2328, trained on the camera-frame xyz codec):
# all weights are loaded shape-tolerantly, the optimizer is fresh, the Track targets change representation.
# Steps 2328-25003 ran on two nodes (16 GPUs, HSDP, batch 8 x 16); from step 25003 it continues on one node
# (8 GPUs, FSDP, batch 8 x 8 x grad_accumulation 2 = the same 128 windows per step):
#   NODES="t1" bash scripts/launch_rt2_2node.sh configs/rt2_direct_v2_uvd.yaml
name: rt2_direct_v2_uvd
output_dir: /ytech_milm_intern/danglingwei/outputs/MetisWAM4D_260921/rt2_direct_v2_uvd
notes: >
  Clean sim depth, clean rigid-body Track4D (robot links + task objects + moving clutter) encoded as pixel-frame
  (du/W, dv/W, dd) with soft-shrink (0.5 px, 0.5 px, 2 mm), scales (1/6 W, 1/6 W, 0.10 m), mu 31; 3-view L layout
  384x320, EEF20 -> unified 80-D (slots 0-9 / 34-43), prompts from the RoboTwin instruction pools via the UMT5 cache.
model:
  experts: [video, track, action]
  action_read: compact
  video:  {dim: 3072, ffn_dim: 14336, layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  track:  {dim: 1024, ffn_dim: 4096,  layers: 20, heads: 24, head_dim: 128, freq_dim: 256}
  action: {dim: 1024, ffn_dim: 4096,  layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  latent_channels: 48
  patch: [1, 2, 2]
  action_dim: 80
  proprio_dim: 80
  text_dim: 4096
  focus: {d_read: 512, num_queries: 32, kappa: 4, read_layers: track_upper_half, feedback_to_track: false,
          spatial_kernel: gaussian, temporal_window: gaussian, anchor_refine: false, anchor_width: 0.15,
          gamma_init: 0.3, detach_world_hidden: false, progress_dim: 3,
          video_window: [0, 8, 0, 10]}   # head view = top 8x10 token block of the 12x10 video grid
  gradient_checkpointing: false
init:
  track: {mode: fresh}     # every weight comes from initialize_from
  initialize_from: /ytech_milm_intern/danglingwei/outputs/MetisWAM4D_260921/rt2_direct_v2/checkpoints/step_0002328
  start_step: 2328
  resume_from: auto
schedule:
  completion: {video: 1.0, track: 0.75, action: 0.25}
  shift: {video: 5.0, track: 5.0, action: 5.0}
  mixture: {trajectory: 0.4, ordered_independent: 0.4, independent: 0.0, clean_fastest: 0.15, clean_all_but_slowest: 0.05}
  inference_rounds: 16
data:
  spec: {video_channels: 48, video_frames: 3, video_height: 24, video_width: 20, track_channels: 48, track_frames: 3,
         track_height: 16, track_width: 20, kappa: 4, token_patch: [2, 2], action_horizon: 32, action_dim: 80,
         proprio_dim: 80, text_dim: 4096, max_text_len: 512}
  rt2:
    root: /m2v_intern_v3/danglingwei/ytech_milm_intern_danglingwei/datas/RT2_MetisWAM4D
    index_file: index.jsonl
    variants: [demo_clean_4d, demo_randomized_4d]
    samples_per_episode: 4
    alpha_stats: /m2v_intern_v3/danglingwei/ytech_m2v8_hdd_intern_dataset_danglingwei/model_zoos/OpenWAM/OpenWAM-Alpha-Sim-RoboTwin-Full/normalization_stats.npy
    embodiment: 2
  rt2_encoder:
    vae_path: /m2v_intern/_public_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    depth_stats: /m2v_intern_v3/danglingwei/ytech_milm_intern_danglingwei/datas/RT2_MetisWAM4D/depth_stats.json
    dtype: bf16
  batch_size: 8
  num_workers: 6
training:
  max_steps: 40000
  groups:
    video:   {lr: 3.0e-7, freeze_steps: 500, ramp_steps: 1500}
    track:   {lr: 3.0e-6, freeze_steps: 0, ramp_steps: 500}
    action:  {lr: 3.0e-6, freeze_steps: 500, ramp_steps: 1500}
    focus:   {lr: 1.0e-4}
    proprio: {lr: 1.0e-6, freeze_steps: 500, ramp_steps: 1500}
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0
  lr_schedule: constant
  dtype: bf16
  fsdp: true
  fsdp_granularity: block
  fsdp_hybrid: true
  fsdp_reshard_after_forward: true
  reduce_dtype: bf16
  grad_accumulation: 2   # 8 GPUs: keeps the 128-window step of the 16-GPU phase
  dense_to_compact_steps: 6000
  dense_to_compact_max_bias: 6.0    # dense future reading is attenuated, not closed: a weak bypass remains
  log_every: 10
  checkpoint_every: 0
  checkpoint_every_minutes: 60   # ~hourly DCP checkpoint + visualisation
  keep_last: 5
  visualize: true
  visualize_samples: 2
  visualize_rounds: 16
  seed: 42
  loss: {video: 1.0, track: 0.2, camera: 0.1, progress: 0.05, action: 1.0, unfold: 0.1, role: 0.1, condition: 0.01}
  dropout: {video_only: 0.15, track_only: 0.10, both: 0.05, action_text: 0.30, action_proprio: 0.30}
