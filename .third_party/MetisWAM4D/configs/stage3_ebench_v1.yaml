# Stage 3 EBench v1 (2026-10-03): SFT on top of OpenWAM-Alpha-Sim-EBench (Test-Mini SR 49.4, first on the board).
#   Video / Action / proprio <- Alpha EBench; Track + reading interface + focus <- RoboDojo v3 anneal step 37951.
#   Data: all 26 EBench-Dataset buckets read through OpenWAM's EBench reader with Alpha's normalization (3-view
#   L layout, raw-23 EEF + base -> unified 80-D, embodiment ebench_lift2); last 2 episodes per bucket held out.
#   EBench has no depth / masks / replayable scenes, so this source carries no Track targets (all pixels unknown);
#   the Action expert never reads the Track branch (RoboDojo v6 recipe).
#   tmux new-session -d -s ebench_train "bash scripts/ebench/run_train_t1.sh configs/stage3_ebench_v1.yaml"
name: stage3_ebench_v1
output_dir: /ytech_milm_intern/danglingwei/outputs/MetisWAM4D_260921/stage3_ebench_v1
notes: >
  EBench SFT from Alpha EBench with the RoboDojo v6 recipe (coupled Track/Action clock, Action reads Video only).
  No Track supervision in v1 (robot FK Track is a later addition).
model:
  experts: [video, track, action]
  action_read: compact
  dense_read_floor: 0.0
  read_action_horizon: 32
  video:  {dim: 3072, ffn_dim: 14336, layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  track:  {dim: 1024, ffn_dim: 4096,  layers: 20, heads: 24, head_dim: 128, freq_dim: 256}
  action: {dim: 1024, ffn_dim: 4096,  layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  latent_channels: 48
  patch: [1, 2, 2]
  action_dim: 80
  proprio_dim: 80
  text_dim: 4096
  focus: {d_read: 512, num_queries: 32, kappa: 4, read_layers: track_upper_half, feedback_to_track: false,
          spatial_kernel: gaussian, temporal_window: gaussian, anchor_refine: false, anchor_width: 0.15,
          gamma_init: 0.3, detach_world_hidden: false, progress_dim: 3,
          video_window: [0, 8, 0, 10]}   # head view = top 8x10 token block of the 12x10 video grid
  gradient_checkpointing: false
init:
  alpha_checkpoint: /ytech_milm_intern/danglingwei/datas/EBench/OpenWAM-Alpha-Sim-EBench
  load_video_from_alpha: true
  load_action_from_alpha: true
  track: {mode: fresh}     # overwritten by initialize_from
  initialize_from: /ytech_milm_intern/danglingwei/outputs/MetisWAM4D_260921/stage3_robodojo_v3_anneal/checkpoints/step_0037951
  initialize_from_exclude: [video., action., proprio_encoder.]   # these three keep Alpha EBench
  start_step: 0
  resume_from: auto
schedule:
  completion: {video: 1.0, track: 0.5, action: 0.5}
  shift: {video: 5.0, track: 5.0, action: 5.0}
  mixture: {trajectory: 0.4, ordered_independent: 0.4, independent: 0.0, clean_fastest: 0.2, clean_all_but_slowest: 0.0}
  inference_rounds: 20
data:
  spec: {video_channels: 48, video_frames: 3, video_height: 24, video_width: 20, track_channels: 48, track_frames: 3,
         track_height: 16, track_width: 20, kappa: 4, token_patch: [2, 2], action_horizon: 32, action_dim: 80,
         proprio_dim: 80, text_dim: 4096, max_text_len: 512}
  robodojo:
    source: ebench
    root: /ytech_milm_intern/danglingwei/datas/EBench/EBench-Dataset
    split: train
    samples_per_episode: 4
    alpha_stats: /ytech_milm_intern/danglingwei/datas/EBench/OpenWAM-Alpha-Sim-EBench/normalization_stats.npy
    embodiment: 7            # ebench_lift2
    val_split: val
    val_batches: 4           # x 8 ranks x batch 8 = 256 fixed held-out windows per evaluation
  robodojo_encoder:
    vae_path: /m2v_intern/_public_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    depth_stats: /ytech_milm_intern/danglingwei/datas/RDJ_selfplay/dataset_v3/depth_stats.json
    dtype: bf16
    unknown_role: true
  batch_size: 8
  num_workers: 10
training:
  max_steps: 20000
  groups:
    video:   {lr: 2.0e-6, ramp_steps: 300}
    track:   {lr: 5.0e-6, ramp_steps: 300}
    action:  {lr: 1.0e-5, ramp_steps: 300}
    focus:   {lr: 5.0e-5}
    proprio: {lr: 2.0e-6, ramp_steps: 300}
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0
  lr_schedule: constant
  dtype: bf16
  fsdp: true
  fsdp_granularity: block
  fsdp_hybrid: true
  fsdp_reshard_after_forward: true
  reduce_dtype: bf16
  grad_accumulation: 2       # 8 GPUs x batch 8 x 2 = 128 windows per step
  dense_to_compact_steps: 0
  log_every: 10
  checkpoint_every: 0
  checkpoint_every_minutes: 30
  keep_last: 12
  visualize: true
  visualize_samples: 2
  visualize_rounds: 20
  eval_every: 1000
  seed: 42
  loss: {video: 1.0, track: 0.2, camera: 0.1, progress: 0.05, action: 1.0, unfold: 0.1, role: 0.1, condition: 0.01,
         read_action: 0.1}
  track_regions: {body: 1.0, object: 0.0, background: 0.0}
  dropout: {video_only: 0.0, track_only: 1.0, both: 0.0, action_text: 0.10, action_proprio: 0.10}
