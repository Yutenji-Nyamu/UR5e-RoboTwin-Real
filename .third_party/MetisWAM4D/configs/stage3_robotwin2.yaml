# Stage 3 - post-training on RoboTwin 2.0 (aloha-agilex, per-arm EEF10 in slots 0-9 / 34-43).
# Alpha multi-view T layout (384x320): head view is the top 8x10 token block of the 12x10 video grid.
name: stage3_robotwin2
output_dir: /m2v_intern_v3/danglingwei/ytech_milm_intern_danglingwei/outputs/MetisWAM4D_260921/stage3_robotwin2
model:
  experts: [video, track, action]
  action_read: compact
  video:  {dim: 3072, ffn_dim: 14336, layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  track:  {dim: 1024, ffn_dim: 4096,  layers: 20, heads: 24, head_dim: 128, freq_dim: 256}
  action: {dim: 1024, ffn_dim: 4096,  layers: 30, heads: 24, head_dim: 128, freq_dim: 256}
  latent_channels: 48
  patch: [1, 2, 2]
  action_dim: 80
  proprio_dim: 80
  text_dim: 4096
  focus: {d_read: 512, num_queries: 4, kappa: 4, read_layers: track_upper_half, feedback_to_track: false, spatial_kernel: adaptive, temporal_window: adaptive, gamma_init: 0.3, detach_world_hidden: false, video_window: [0, 8, 0, 10]}
  gradient_checkpointing: false   # 640 tokens/sample: launch-bound, batch 4 fits without recompute
init:
  alpha_checkpoint: null      # all experts come from the stage-2 model
  load_action_from_alpha: false   # Action comes from the stage-2 model
  track: {mode: fresh}          # overwritten by initialize_from
  initialize_from: /m2v_intern_v3/danglingwei/ytech_milm_intern_danglingwei/outputs/MetisWAM4D_260921/stage2_midtrain_ig10k/checkpoints/latest
  resume_from: auto
schedule:
  completion: {video: 1.0, track: 0.75, action: 0.25}
  shift: {video: 5.0, track: 5.0, action: 5.0}
  mixture: {trajectory: 0.4, ordered_independent: 0.4, independent: 0.0, clean_fastest: 0.15, clean_all_but_slowest: 0.05}
  inference_rounds: 16
data:
  spec: {video_channels: 48, video_frames: 3, video_height: 24, video_width: 20, track_channels: 48, track_frames: 3,
         track_height: 16, track_width: 20, kappa: 4, token_patch: [2, 2], action_horizon: 32, action_dim: 80,
         proprio_dim: 80, text_dim: 4096, max_text_len: 512}
  components:
    - name: robotwin2
      weight: 1.0
      manifest: /m2v_intern_v3/danglingwei/ytech_milm_intern_danglingwei/datas/MetisWAM4D/latents/robotwin2/manifest.jsonl
      modalities: [video, track, action]
      embodiment: robotwin2_aloha_agilex
  batch_size: 4
  num_workers: 4
training:
  max_steps: 30000
  groups:
    video:   {lr: 3.0e-7}
    track:   {lr: 2.0e-6}
    action:  {lr: 1.0e-6, freeze_steps: 500, ramp_steps: 1000}
    focus:   {lr: 1.0e-5}
    proprio: {lr: 1.0e-6, freeze_steps: 500, ramp_steps: 1000}
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0
  lr_schedule: constant
  dtype: bf16
  fsdp: true
  fsdp_granularity: block
  fsdp_hybrid: true                # shard inside a node, replicate across nodes (TCP inter-node links)
  fsdp_reshard_after_forward: true
  reduce_dtype: bf16
  grad_accumulation: 2             # global batch = 4 x GPUs x 2
  dense_to_compact_steps: 0        # already compact after stage 2
  log_every: 20
  checkpoint_every: 2000
  keep_last: 3
  seed: 42
  loss: {video: 1.0, track: 0.2, camera: 0.1, action: 1.0, unfold: 0.1, role: 0.1, condition: 0.01}
  dropout: {video_only: 0.15, track_only: 0.10, both: 0.05}
